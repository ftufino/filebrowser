name: File Browser
version: "2.64.7"
slug: filebrowser
description: File Browser with expiring shares and automatic file deletion
url: https://github.com/ftufino/filebrowser
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
options:
  base_url: ""
schema:
  base_url: str?
map:
  - share:rw
  - media:rw
