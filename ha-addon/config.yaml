name: File Browser
version: "2.64.4"
slug: filebrowser
description: File Browser with expiring shares and automatic file deletion
url: https://github.com/ftufino/filebrowser
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
options:
  port: 8080
  base_url: ""
schema:
  port: port
  base_url: str?
map:
  - share:rw
  - media:rw
